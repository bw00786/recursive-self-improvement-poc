[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-backend"
version = "0.1.0"
description = "Recursive AI Improvement Laboratory backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
observability = [
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "langfuse>=2.50",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*", "sut*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
